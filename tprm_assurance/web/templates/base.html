<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}tprm-assurance{% endblock %}</title>
<style>
  :root { --ink:#1b2430; --muted:#5b6675; --line:#dfe3e8; --bg:#f6f7f9; --card:#fff; --accent:#0f6e6a;
          --ok:#1d7a3a; --okbg:#e6f4ea; --warn:#8a5a00; --warnbg:#fff4dc; --bad:#a32020; --badbg:#fde8e8; --info:#24539a; --infobg:#e8eefa; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--ink); color:#fff; padding:12px 24px; display:flex; gap:16px; align-items:baseline; }
  header a { color:#fff; text-decoration:none; font-weight:600; }
  header span { color:#aab4c0; font-size:13px; }
  main { max-width:1180px; margin:0 auto; padding:20px 24px 60px; }
  h1 { font-size:22px; margin:8px 0 4px; } h2 { font-size:17px; margin:24px 0 8px; }
  .muted { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin:12px 0; }
  .grid { display:grid; grid-template-columns: 3fr 2fr; gap:16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  code { font-size:12px; background:#eef1f4; padding:1px 4px; border-radius:3px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .PROPOSED, .OPEN { background:var(--warnbg); color:var(--warn); }
  .APPROVED, .RESOLVED { background:var(--okbg); color:var(--ok); }
  .REJECTED { background:#eee; color:#555; }
  .HIGH { background:var(--badbg); color:var(--bad); } .LOW { background:var(--infobg); color:var(--info); }
  .msg { padding:10px 14px; border-radius:6px; margin:10px 0; }
  .msg.ok { background:var(--okbg); color:var(--ok); } .msg.err { background:var(--badbg); color:var(--bad); }
  .msg.gate { background:var(--badbg); color:var(--bad); font-weight:600; } .msg.open { background:var(--okbg); color:var(--ok); font-weight:600; }
  .tabs a { display:inline-block; padding:6px 12px; margin-right:6px; border:1px solid var(--line); border-radius:6px;
            text-decoration:none; color:var(--ink); background:#fff; }
  .tabs a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  form.inline { display:inline; }
  button { font:inherit; padding:5px 12px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:var(--accent); }
  button.small { padding:2px 8px; font-size:13px; }
  input[type=text], input[type=date], input[type=number], select, textarea { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:5px; }
  textarea { width:100%; }
  .row-form { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .row-form input[type=text] { width:120px; }
</style>
</head>
<body>
<header><a href="/">tprm-assurance</a><span>local review workspace · runs on this machine only</span></header>
<main>
{% if msg %}<div class="msg ok">{{ msg }}</div>{% endif %}
{% if err %}<div class="msg err">{{ err }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
